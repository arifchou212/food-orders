<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Collection Slot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>
            Edit Collection Slot
        </h1>

        <p>
            {{ slot.start_time.strftime("%H:%M") }}
            -
            {{ slot.end_time.strftime("%H:%M") }}
        </p>

    </header>


    <main>

        {% if error %}

            <p>
                <strong>{{ error }}</strong>
            </p>

        {% endif %}


        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <label for="capacity">
                Maximum orders
            </label>

            <input
                type="number"
                id="capacity"
                name="capacity"
                min="1"
                value="{{ slot.capacity }}"
                required
            >


            <button type="submit">
                Save
            </button>

        </form>


        <p>

            <a href="{{ url_for('admin_menu') }}">
                Cancel
            </a>

        </p>

    </main>

</body>

</html>
