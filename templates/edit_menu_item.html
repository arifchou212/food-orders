<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Food</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>Edit Food</h1>

        <p>
            Update this food item's details.
        </p>

    </header>


    <main>

        <h2>
            {{ item.name }}
        </h2>


        {% if error %}

            <p>
                {{ error }}
            </p>

        {% endif %}


        <form method="POST">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="name">
                Food name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ item.name }}"
                required
            >


            <br>


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
            >{{ item.description or "" }}</textarea>


            <br>


            <label for="price">
                Price (£)
            </label>

            <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
                value="{{ item.price }}"
                required
            >


            <br>


            <label for="production_quantity">
                Production quantity
            </label>

            <input
                type="number"
                id="production_quantity"
                name="production_quantity"
                min="0"
                value="{{ item.production_quantity }}"
                required
            >


            <br>


            <button type="submit">
                Save Changes
            </button>

        </form>


        <br>


        <a href="{{ url_for('admin_menu') }}">
            Back to Menu
        </a>

    </main>

</body>

</html>
