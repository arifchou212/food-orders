<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Food Day</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>Create Food Day</h1>

        <p>
            Create a new day for selling food.
        </p>

    </header>


    <main>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="name">
                Food day name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Saturday Food"
                required
            >
            <br>


            <label for="event_date">
                Date
            </label>

            <input
                type="date"
                id="event_date"
                name="event_date"
                required
            >
            <br>

            <label for="collection_start_time">
                Collection start time
            </label>

            <input
                type="time"
                id="collection_start_time"
                name="collection_start_time"
                required
            >
            <br>

            <label for="collection_end_time">
                Collection end time
            </label>

            <input
                type="time"
                id="collection_end_time"
                name="collection_end_time"
                required
            >
            <br>

            <label for="collection_slot_duration">
                Collection slot length (minutes)
            </label>

            <input
                type="number"
                id="collection_slot_duration"
                name="collection_slot_duration"
                min="1"
                required
            >
            <br>

            <label for="collection_slot_capacity">
                Maximum orders per slot
            </label>

            <input
                type="number"
                id="collection_slot_capacity"
                name="collection_slot_capacity"
                min="1"
                required
            >

            <button type="submit">
                Create Food Day
            </button>

        </form>


        <br>


        <a href="{{ url_for('admin_menu') }}">
            Back to Menu
        </a>

    </main>

</body>

</html>
